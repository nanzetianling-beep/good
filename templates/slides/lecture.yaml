# ③ 対面レクチャー資料の中身(章の名前・目安時間・同席者は spec/items.yaml の chapters)
#
# 操作スライドは「手順(番号付き)」「画面のスクリーンショット枠」「やってみよう」の3段構成。
#   steps  … 手順(3〜5行)
#   screen … slides/images/ に置くスクリーンショットのファイル名(差し替え用)
#   try    … やってみよう
# checks は章の最後の「できたらチェック」と、当日チェックリストに同じ文言で出す。
# [ ] で囲んだ所は、訪問前に導入担当が書き換える。

chapters:
  0:
    slides:
      - kind: agenda
        title: 本日の流れ
        lead: 実際にPOSを触りながら、ひとつずつ覚えていきます。
    checks: []

  1:
    slides:
      - title: 許可証を撮影する
        steps:
          - 許可証・届出の控えを用意する
          - 設定画面の「許可証」を開く
          - 撮影して、種類と有効期限を入れる
        screen: 01-license.png
        try: 風営法の許可証を1枚登録する
      - title: ログインIDとパスワードを決める
        steps:
          - オーナーのIDとパスワードを、その場で決める
          - 紙やLINEには残さず、覚えるか管理ツールへ
          - スタッフの分も同じように作る
        screen: 01-login.png
        try: 店長のアカウントでログインし直す
      - title: スタッフごとに権限を分ける
        steps:
          - 「メンバー」から権限を開く
          - 取消や給与を見られる人を決める
          - キャストは打刻だけにしておく
        screen: 01-permission.png
        try: スタッフ1人の権限を「一般」にする
    checks:
      - 許可証を撮影して登録した
      - オーナーと店長がログインできた
      - スタッフの権限を決めた

  2:
    slides:
      - title: 卓をフロアマップに並べる
        steps:
          - 「フロアマップ」を開く
          - 送っていただいた卓が、左に並んでいます
          - 実際の配置どおりに、ドラッグで置く
        screen: 02-floormap.png
        try: VIP席を奥の位置に動かす
    checks:
      - すべての卓を配置した

  3:
    slides:
      - title: 入店とセット開始
        steps:
          - 卓をタップする
          - 人数とセットを選ぶ
          - 「開始」で時間が動き出す
        screen: 03-start.png
        try: 卓「VIP1」で2名・セット1を始める
      - title: 延長をつける
        steps:
          - 卓をタップする
          - 「延長」ボタンから時間を選ぶ
          - 伝票の合計が増えたことを確認する
        screen: 03-extension.png
        try: 卓「VIP1」に延長30分をつける
        note: 終了が近づくと、卓の色が変わってお知らせします。
      - title: 指名と注文を追加する
        steps:
          - 卓の伝票を開く
          - 「指名」からキャストと区分を選ぶ
          - 「注文」から商品を選ぶ
        screen: 03-order.png
        try: 本指名とシャンパンを1本つける
      - title: 会計する
        steps:
          - 「会計」を押す
          - 支払い方法を選ぶ
          - お預かり金額を入れて確定する
        screen: 03-checkout.png
        try: VIP1を現金で会計する
    checks:
      - セット開始から会計まで、1卓を通しでできた

  4:
    slides:
      - title: キャストを卓に付ける
        steps:
          - 卓の「キャスト」を開く
          - 名前を選び、指名・場内・同伴・ヘルプを選ぶ
          - 付いた時刻が自動で記録されます
        screen: 04-assign.png
        try: ココを本指名、りんをヘルプで付ける
      - title: 付け替えと売上の折半
        steps:
          - 付け替えは、名前を長押しして移す
          - 折半は、キャストを2人選んで割合を決める
          - 売上の付き方を画面で確認する
        screen: 04-split.png
        try: 本指名の売上を2人で半分ずつにする
    checks:
      - キャストの付け方と付け替えができた

  5:
    slides:
      - kind: table
        title: バックは10パターンから選びます
        columns: [パターン, 内容]
        rows:
          - [① 指名バック, 指名ごとに、円か指名料の%で支給]
          - [② 担当卓売上バック, 担当した卓の売上の%]
          - [③ 商品バック, 特定の商品を出したキャストに支給]
          - [④ ボトル折半, ボトル1本を、付いたキャストで分ける]
          - [⑤ スライド, 月間の実績で率が上がる]
          - [⑥ 時給併用, 時給に①〜⑤を上乗せ]
          - [⑦ 保証比較, 日給保証と①〜⑥の高い方]
          - [⑧ ポイント時給, ポイントで時給が変わる]
          - [⑨ 本数ボーナス, 月の指名本数で固定ボーナス]
          - [⑩ ヘルプバック, 他のルールに係数をかけてヘルプへ]
      - title: お店のルールを設定する
        steps:
          - 今のバックの決め方を、口頭で伺います
          - 近いパターンを選び、率や金額を入れる
          - 有効なルールは、すべて足し算されます
        screen: 05-back.png
        try: 本指名バック1,000円を設定する
    checks:
      - バックのルールを設定した

  6:
    slides:
      - kind: table
        title: テスト会計で答え合わせ
        lead: 同じ伝票を、POSと手計算で比べます。
        columns: [確認すること, 見る所]
        rows:
          - [サービス料, 小計にかかっているか]
          - [端数処理, 総額の丸め方が合っているか]
          - [税, 内税・外税の表示が合っているか]
          - [カード手数料, カード払いのときだけ乗るか]
      - title: テスト伝票を会計する
        steps:
          - 練習用の卓でセットと注文を入れる
          - 現金とカードで、1回ずつ会計する
          - 金額を手計算と比べる
        screen: 06-test.png
        try: カード払いで、手数料込みの金額を確かめる
    checks:
      - テスト会計の金額が正しかった

  7:
    slides:
      - title: 伝票を直す・取り消す
        steps:
          - 会計済みの伝票を「履歴」から開く
          - 「訂正」で直すか、「取消」で消す
          - 権限のある人だけが操作できます
        screen: 07-void.png
        try: テスト伝票を取り消す
    checks:
      - 訂正と取消の手順を確認した

  8:
    slides:
      - title: プリンターをつないで試し刷り
        steps:
          - プリンターの電源を入れ、同じWi-Fiにつなぐ
          - 「プリンター設定」で機器を選ぶ
          - 「試し刷り」を押す
        screen: 08-printer.png
        try: 試し刷りを1枚出す
      - title: 用紙の交換と領収書
        steps:
          - ふたを開けて、紙の向きをそろえて入れる
          - 領収書のデザインを、実物を見て決める
          - 宛名と但し書きを入れて印刷する
        screen: 08-receipt.png
        try: 領収書を1枚印刷する
    checks:
      - プリンターで領収書が出た

  9:
    slides:
      - title: 注文を厨房に印刷する
        steps:
          - フロアで注文を入れる
          - 選んだカテゴリーだけ、厨房で印刷されます
          - 出したら、伝票に「提供済み」を付ける
        screen: 09-kitchen.png
        try: 唐揚げを注文して、厨房で印刷する
    checks:
      - キッチン伝票が厨房で出た

  10:
    slides:
      - title: レジを開ける
        steps:
          - 営業前に「レジ開け」を押す
          - 釣銭準備額を確かめて入れる
          - これで会計ができるようになります
        screen: 10-open.png
        try: レジ金50,000円でレジを開ける
      - title: レジを締める
        steps:
          - 営業後に「レジ締め」を押す
          - お札と硬貨の枚数を数えて入れる
          - 過不足が出たら、理由をメモする
        screen: 10-close.png
        try: レジを締めて、日報を出す
    checks:
      - レジ開けからレジ締めまでできた

  11:
    slides:
      - title: 時給やランクをお店が入力する
        steps:
          - 「メンバー」からキャストを開く
          - 時給・ランク・源泉区分・交通費を入れる
          - 最初の1〜2人は一緒に入れます
        screen: 11-pay.png
        try: キャスト1人の時給を入れる
        note: この画面はオーナー・店長だけが見られます。
      - title: キャスト本人が個人情報を入れる
        steps:
          - 本人に端末を渡す
          - 本名・連絡先・口座などを、本人が入れる
          - 身分証を店長が確認する
        screen: 11-personal.png
        try: キャスト1人が、自分の情報を入れる
    checks:
      - 全キャストが登録済み

  12:
    slides:
      - title: 出勤・退勤を打刻する
        steps:
          - 「打刻」で自分の名前を選ぶ
          - 「出勤」か「退勤」を押す
          - 遅刻は、決めたルールで自動で控除されます
        screen: 12-clock.png
        try: キャスト1人が出勤を打刻する
    checks:
      - 出勤・退勤の打刻ができた

  13:
    slides:
      - kind: faq
        title: 困ったときは
        contact:
          - 電話:[サポート窓口の電話番号]
          - 受付:[受付時間]
          - LINE:[サポート用LINEのID]
        faq:
          - [会計を間違えた, 7章の「訂正と取消」を見てください]
          - [プリンターが出ない, 電源とWi-Fiを確かめて、試し刷りをしてください]
          - [キャストが増えた, 11章と同じ手順で追加してください]
    checks: []
