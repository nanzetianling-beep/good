      - [本指名, 3000, 60]
      - [場内指名, 2000, 60]
      - [同伴, 3000, 60]
      - [ヘルプ, 0, 0]
    source: {sample: nomination, question: 指名区分}
    hint: |-
      例)本指名/3000円/60分ごと
      例)場内指名/2000円/60分ごと
