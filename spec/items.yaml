  - id: rounding_example
    route: form
    section: S3
    label: 端数処理とは
    type: note
    body: |-
      お会計の端数を、きりのいい金額にそろえる設定です。
      お会計が12,345円のときの例です。

      ・100円単位で切り捨て → 12,300円
      ・100円単位で切り上げ → 12,400円
      ・1000円単位で切り捨て → 12,000円
      ・なし → 12,345円のまま
    source: {doc: 2026-09-25 店舗向けの説明として追加}

  - id: total_rounding_unit
    route: form
    section: S3
    label: 端数処理(単位)
    type: dropdown
    options: [なし, 10円, 100円, 500円, 1000円]
    source: {sample: pricing, question: 総額の端数処理}
    hint: |-
      会計の端数を、何円単位でそろえるかです
    help:
      - title: "選び方"
        text: |-
          会計が12,345円のときの例です(切り捨て)。

          10円 → 12,340円
          100円 → 12,300円
          500円 → 12,000円
          1000円 → 12,000円
          なし → 12,345円のまま

          端数をそろえないお店は「なし」です。

  - id: total_rounding_mode
    route: form
    section: S3
    label: 端数処理(方法)
    type: dropdown
    options: [切り捨て, 切り上げ]
    source: {sample: pricing, question: 総額の端数処理}

  # ── 既存見本 ③ 指名・バック設定 ───────────────────────────
    hint: |-
