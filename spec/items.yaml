# ポッキリ.Night 初期設定キット 項目定義(唯一の正)
#
# ①導入アンケート・②記入テンプレート・③対面レクチャー資料は、すべてこのファイルから生成する。
# 成果物のファイルを手で直さず、このファイルかテンプレートを直して再生成すること。
#
# excluded … 見本にあるが扱わない質問(reason に理由)
#
# route:
#   form     … ① 導入アンケート(section: S1〜S11)
#   template … ② 記入テンプレート(theme: 1〜6)
#   onsite   … ③ 対面訪問で扱う(chapter: 0〜13、onsite_note に扱い方)
#   fixed    … 質問しない。default の値で固定
#
# source:
#   sample   … 既存見本 reference/survey_sample.html の SECTIONS の id
#   question … 同じく質問の l(ラベル)をそのまま
#   doc      … 見本になく、要件定義書で追加した項目の出典(例:3章 S1)

version: 1

# ① 導入アンケートの表紙と送信後の画面
form:
  title: ポッキリ.Night 導入アンケート
  intro: |-
    このたびは、ポッキリ.Nightを
    お選びいただきありがとうございます。

    お店の料金やルールを伺い、
    POSの初期設定に使わせていただきます。
  facts:
    - 所要時間は約15〜20分です
    # {deadline} はページで置き換える(URLに ?visit=2026-10-05 があれば、その2日前の日付)
    - 回答期限:{deadline}
    - 期限までに内容を記入してください
    - すべての項目の記入が必要です
  done: |-
    送っていただいたら、回答は完了です。
    ありがとうございました。

    次に、商品メニューや名簿などを
    LINEで送っていただきます。

    担当者から、記入用のひな形を
    LINEでお送りします。
    届くまで少々お待ちください。

sections:
  - {id: S2, title: 店舗名・営業時間の区分, desc: 店舗名と、一部・二部の分け方を伺います。}
  - {id: S3, title: 料金のルール, desc: セット・延長の料金とバック、そのほかの料金、端数の扱いです。}
  - {id: S11, title: 卓, desc: お店にある卓(テーブル・カウンター・個室など)です。}
  - {id: S4, title: 指名・バック, desc: 指名・売上・商品のバックと、端数の扱いです。}
  - {id: S5, title: 税・インボイス, desc: 領収書と会計の税の扱いに使います。}
  - {id: S6, title: 決済方法, desc: カード払いと売掛の手数料について伺います。}
  - {id: S7, title: レジ, desc: レジを開けるときと、締めるときの設定です。}
  - {id: S8, title: プリンター・伝票, desc: レシートプリンターと、伝票・領収書の設定です。}
  - {id: S9, title: 来店のきっかけ, desc: 新規やリピーターなど、来店のきっかけを集計します。}
  - {id: S10, title: 給与のルール, desc: お店全体の給与・送り代のルールです。キャストごとの時給は訪問時に伺います。}

# ② 記入テンプレート(LINE・Excel)
#   line_notes … LINEの【テーマ名】の直後に入れる注意書き
#   line_after … 表の後ろに付け足す行
themes:
  - id: 3
    title: 商品メニュー
    sheet: 商品メニュー
    photo_ok: true
    line_notes:
      - メニュー表の写真だけでもOKです
      - 写真の場合は、下の2つだけ教えてください
    line_after:
      - ■キャストドリンクになる商品
      - ・例)ウーロン茶、ハイボール
      - ■ボトルキープできる商品
      - ・例)鏡月、ヴーヴクリコ
    excel_notes:
      - 「キャストドリンク」は、お客様がキャストにごちそうするドリンクです
      - ○を付けた商品は、注文が入るとキャストにバックが付きます
      - 例)800円のウーロン茶なら、その○%がキャストのバックになります
      - 一律のバックはアンケートで、キャストごとの場合は訪問時に伺います
  - id: 5
    title: キャスト・スタッフ名簿
    sheet: 名簿
    photo_ok: true
    line_notes:
      - 在籍表やシフト表の写真でもOKです
      - 時給や本名・住所などの個人情報は送らないでください
      - 時給は訪問時に、お店の方がPOSへ入力します
    excel_notes: [時給や本名・住所などの個人情報は書かないでください]

# ③ 対面レクチャーの章(スライドの中身は templates/slides/lecture.yaml)
chapters:
  - {id: 0, title: 本日の流れ, minutes: 3, attendees: 全員}
  - {id: 1, title: 最初の準備, minutes: 10, attendees: オーナー・店長}
  - {id: 2, title: 卓の配置, minutes: 5, attendees: 店長}
  - {id: 3, title: 接客の基本の流れ, minutes: 15, attendees: 店長・スタッフ}
  - {id: 4, title: キャストの付け方, minutes: 10, attendees: 店長・スタッフ}
  - {id: 5, title: バックの決め方, minutes: 15, attendees: オーナー・店長}
  - {id: 6, title: テスト会計, minutes: 10, attendees: 店長}
  - {id: 7, title: 訂正と取消, minutes: 5, attendees: オーナー・店長}
  - {id: 8, title: プリンター, minutes: 10, attendees: 店長・スタッフ}
  - {id: 9, title: キッチン伝票, minutes: 5, attendees: 厨房, skip_if: {item: kitchen_slip, equals: 使わない}}
  - {id: 10, title: レジ, minutes: 10, attendees: 店長・スタッフ}
  - {id: 11, title: メンバー登録, minutes: 15, attendees: オーナー・店長・キャスト}
  - {id: 12, title: 出退勤と遅刻, minutes: 5, attendees: キャスト・スタッフ}
  - {id: 13, title: 困ったとき, minutes: 5, attendees: 全員}

# 見本にあるが、キットでは扱わないと決めた質問(どの成果物にも出さない)
excluded:
  - {sample: store, question: 業態, reason: 不要と判断}
  - {sample: store, question: 郵便番号 ／ 電話番号, reason: 不要と判断}
  - {sample: store, question: 住所, reason: 不要と判断}
  - {sample: store, question: 事業者名（法人名）, reason: 不要と判断}
  - {sample: store, question: 最寄り駅, reason: 不要と判断}
  - {sample: pricing, question: 本日の売上目標をフロアに表示するか, reason: 不要と判断}
  - {sample: pricing, question: 達成時インセンティブ, reason: 不要と判断}
  - {sample: register, question: 日報の出力形式, reason: 不要と判断}
  - {sample: printer, question: 自動印字（CloudPRNT）を使うか, reason: 不要と判断}
  - {sample: printer, question: 収入印紙, reason: 不要と判断}
  - {sample: printer, question: 印刷するもの, reason: 不要と判断}
  - {sample: expenses, question: 経費カテゴリ, reason: 不要と判断}
  - {sample: nomination, question: ヘルプで付いたキャストにも売上を付けるか, reason: 不要と判断}
  - {sample: pricing, question: 人数分で課金するもの, reason: 不要と判断}

items:

  # ── 既存見本 ① 店舗情報 ─────────────────────────────

  - id: store_name
    route: form
    section: S2
    label: 店舗名
    type: short
    required: true
    placeholder: 例:Club ポッキリ 新宿店
    hint: 看板やメニューに書いている店名を入力してください
    source: {sample: store, question: 店舗名}
    help:
      - title: "書き方"
        text: |-
          看板やメニューと同じ店名を書いてください。
          例)Club ポッキリ 新宿店

          系列店がある場合は、「新宿店」のように
          店舗名まで入れると区別しやすくなります。

  - id: shift_split
    route: form
    section: S2
    label: 一部・二部(深夜)の区別
    type: radio
    options: [使わない, 使う]
    source: {sample: store, question: 一部（通常）／二部（深夜）の切り替え時刻}
    hint: |-
      営業時間を、一部と二部(深夜)に分けて集計するかどうかです
    help:
      - title: "「使う」が合うお店"
        text: |-
          夜の営業と深夜の営業で、
          料金やシフトを分けているお店です。
          例)20時〜1時が一部、1時〜5時が二部

          売上や出勤を、一部と二部で分けて見られます。
      - title: "「使わない」が合うお店"
        text: |-
          開店から閉店まで、1つの営業として扱うお店です。
          例)20時〜1時だけの営業
          例)深夜営業をしていない

          迷ったら「使わない」で大丈夫です。

  - id: shift_split_start
    route: form
    section: S2
    label: 二部の開始時刻
    type: time
    show_if: {item: shift_split, equals: 使う}
    source: {sample: store, question: 一部（通常）／二部（深夜）の切り替え時刻}
    hint: |-
      二部(深夜)が始まる時刻を選んでください
    help:
      - title: "選び方"
        text: |-
          例)1時から深夜営業なら、1時00分を選びます。
          例)0時30分から二部なら、0時30分を選びます。

          この時刻を境に、一部と二部を分けて集計します。

  - id: shift_split_end
    route: form
    section: S2
    label: 二部の終了時刻
    type: time
    hint: 翌朝の場合は、そのままの時刻を選びます(例:5時(翌朝)なら5時00分)
    show_if: {item: shift_split, equals: 使う}
    source: {sample: store, question: 一部（通常）／二部（深夜）の切り替え時刻}
    help:
      - title: "選び方"
        text: |-
          例)朝5時に閉店するなら、5時00分を選びます。
          例)朝6時まで営業なら、6時00分を選びます。

          日付をまたぐ時刻も、そのまま選べば大丈夫です。

  - id: licenses
    route: onsite
    chapter: 1
    label: 許可証・届出
    type: table
    columns: [種類, 番号(任意), 有効期限(任意)]
    onsite_note: 訪問時に撮影する。LINEでの送付は求めない
    source: {sample: store, question: 許可証・届出}

  # ── 既存見本 ② 料金セット ─────────────────────────────

  - id: price_sets
    route: form
    section: S3
    label: 料金セット
    type: table
    columns: [セット名, 時間(分), 料金(円)]
    cells: [text, int, int]
    examples:
      - [セット1, 60, 8000]
      - [VIPセット, 60, 15000]
    hint: |-
      例)セット1/60分/8000円
      例)VIPセット/60分/15000円
      お店のセットを、1行に1つずつ書いてください。
    source: {sample: pricing, question: セット（基本の料金）}
    help:
      - title: "書き方"
        text: |-
          お客様が最初に選ぶ、料金のセットを書きます。
          時間か料金が違うものは、別の行にします。

          例)通常セット/60分/8000円
          例)VIPセット/60分/15000円
          例)女性客セット/60分/5000円

          曜日や時間で料金が変わる場合は、
          「平日セット」「週末セット」のように
          分けて書いてください。

  - id: set_back_mode
    route: form
    section: S3
    label: セットバック(全キャスト)
    type: radio
    options: [店舗一律, キャストごとに違う]
    hint: |-
      セット料金に対して、付いたキャストに付くバックです。
      「店舗一律」にすると、全キャストが同じバックになります。
    source: {doc: 追加要望 S3 セットバック}
    help:
      - title: "「店舗一律」が合うお店"
        text: |-
          どのキャストでも、セット料金のバックが同じお店です。
          例)セット8,000円の10%なら、全員800円

          次の質問で、金額か%を入力します。
          バックを付けていないお店も、こちらを選び
          次の質問で「0」と入力してください。
      - title: "「キャストごとに違う」が合うお店"
        text: |-
          ランクや人によって、バックが違うお店です。
          例)Aさんは10%、Bさんは500円、新人は0円

          キャストごとの金額は、訪問時に伺い
          POSへ一緒に登録します。

  - id: set_back_rate
    route: form
    section: S3
    label: セットバックの金額・率(店舗一律)
    type: rate
    units: ["%", 円]
    show_if: {item: set_back_mode, equals: 店舗一律}
    hint: 1セットあたりの金額か、セット料金の%を入力してください
    source: {doc: 追加要望 S3 セットバック}
    help:
      - title: "入力のしかた"
        text: |-
          先に「%」か「円」を選び、数字を入力します。

          例)セット料金の10% → 「10」と「%」
          例)1セットにつき500円 → 「500」と「円」

          バックを付けていない場合は「0」です。

  - id: set_back_later
    route: form
    section: S3
    label: セットバックは、あとで登録します
    type: note
    show_if: {item: set_back_mode, equals: キャストごとに違う}
    body: キャストごとのバックは、訪問時にPOSへ一緒に登録します。
    source: {doc: 追加要望 S3 セットバック}

  - id: extension_menu
    route: form
    section: S3
    label: 延長メニュー
    type: table
    columns: [名前, 時間(分), 料金(円)]
    cells: [text, int, int]
    examples:
      - [延長30分, 30, 4000]
      - [延長60分, 60, 8000]
    source: {sample: pricing, question: 延長メニュー}
    hint: |-
      延長するときの時間と料金を、1行に1つ書いてください。
      例)延長30分/30分/4000円
    help:
      - title: "書き方"
        text: |-
          セットの時間が終わったあと、
          お客様が延長するときの料金です。

          例)延長30分/30分/4000円
          例)延長60分/60分/8000円
          例)VIP延長/30分/7000円

          延長をしていないお店は、
          「延長なし/0/0」と書いてください。

  - id: extension_back_mode
    route: form
    section: S3
    label: 延長バック(全キャスト)
    type: radio
    options: [店舗一律, キャストごとに違う]
    hint: |-
      延長が1回入るごとに、キャストに付くバックです。
      「店舗一律」にすると、全キャストが同じバックになります。
    source: {doc: 追加要望 S3 延長バック}
    help:
      - title: "「店舗一律」が合うお店"
        text: |-
          どのキャストでも、延長のバックが同じお店です。
          例)延長4,000円の10%なら、全員400円

          次の質問で、金額か%を入力します。
          バックを付けていないお店も、こちらを選び
          次の質問で「0」と入力してください。
      - title: "「キャストごとに違う」が合うお店"
        text: |-
          ランクや人によって、バックが違うお店です。
          例)Aさんは10%、Bさんは500円、新人は0円

          キャストごとの金額は、訪問時に伺い
          POSへ一緒に登録します。

  - id: extension_back_rate
    route: form
    section: S3
    label: 延長バックの金額・率(店舗一律)
    type: rate
    units: ["%", 円]
    show_if: {item: extension_back_mode, equals: 店舗一律}
    hint: 延長1回あたりの金額か、延長料金の%を入力してください
    source: {doc: 追加要望 S3 延長バック}
    help:
      - title: "入力のしかた"
        text: |-
          先に「%」か「円」を選び、数字を入力します。

          例)延長料金の10% → 「10」と「%」
          例)延長1回につき300円 → 「300」と「円」

          バックを付けていない場合は「0」です。

  - id: extension_back_later
    route: form
    section: S3
    label: 延長バックは、あとで登録します
    type: note
    show_if: {item: extension_back_mode, equals: キャストごとに違う}
    body: キャストごとのバックは、訪問時にPOSへ一緒に登録します。
    source: {doc: 追加要望 S3 延長バック}

  - id: extension_alert
    route: form
    section: S3
    label: 延長アラート
    type: dropdown
    options: [終了の5分前, 終了の10分前, 終了の15分前]
    hint: この時刻になると、卓の色が変わってお知らせします
    source: {sample: pricing, question: 延長アラート（終了の何分前に卓の色を変えるか）}
    help:
      - title: "選び方"
        text: |-
          セット終了の少し前に、卓の色が変わります。
          スタッフが延長を確認しに行く合図です。

          例)60分セットで「終了の10分前」なら、
          開始から50分で色が変わります。

          お客様に延長を聞くタイミングに合わせて
          選んでください。

  - id: auto_extension
    route: form
    section: S3
    label: 自動延長
    type: radio
    options: [使わない, 使う]
    hint: |-
      セットの時間が終わったら、決めた間隔で自動で延長をつける機能です。
      「使わない」場合は、上の延長メニューから手で延長をつけます。
    source: {sample: pricing, question: 自動延長を使うか}
    help:
      - title: "「使う」が合うお店"
        text: |-
          時間が来たら、そのまま延長になるお店です。
          例)セット終了後、30分ごとに4000円を加算

          延長のつけ忘れを防げます。
      - title: "「使わない」が合うお店"
        text: |-
          お客様に確認してから延長するお店です。
          例)「延長されますか」と聞いてから、
          スタッフが延長メニューで延長をつける

          迷ったら「使わない」で大丈夫です。

  - id: auto_extension_interval
    route: form
    section: S3
    label: 自動延長の間隔
    type: number
    unit: 分ごと
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    show_if: {item: auto_extension, equals: 使う}
    source: {sample: pricing, question: 自動延長の内容}
    hint: |-
      何分ごとに、自動で延長をつけるかです
    help:
      - title: "入力のしかた"
        text: |-
          例)30分ごとなら「30」
          例)60分セットの後、1時間ごとなら「60」

          セット終了後、この分数ごとに1回ずつ
          延長がつきます。

  - id: auto_extension_price
    route: form
    section: S3
    label: 自動延長の金額
    type: number
    unit: 円
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    show_if: {item: auto_extension, equals: 使う}
    source: {sample: pricing, question: 自動延長の内容}
    hint: |-
      自動延長1回あたりの料金です
    help:
      - title: "入力のしかた"
        text: |-
          例)30分4000円なら「4000」
          例)60分8000円なら「8000」

          カンマは付けずに、数字だけ入力してください。

  - id: service_charge
    route: form
    section: S3
    label: サービス料
    type: radio
    options: [なし, 10%, 15%, 20%, その他]
    other: {type: number, unit: "%", min: 0, max: 100}
    hint: 会計の小計にかける割合です
    source: {sample: pricing, question: サービス料 ／ ハウスチャージ}
    help:
      - title: "選び方"
        text: |-
          会計の小計にかける割合で、
          「TAX」「サービス料」と呼ぶお店が多いです。

          例)小計10,000円でサービス料20%なら、
          2,000円が足されて12,000円になります。

          かけていないお店は「なし」です。
          一覧にない率(25%など)は「その他」を選び、
          横の欄に数字を入力します。

  - id: house_charge
    route: form
    section: S3
    label: ハウスチャージの有無
    type: radio
    options: [なし, あり]
    hint: セット料金とは別にかかる、席料などの料金です
    source: {sample: pricing, question: サービス料 ／ ハウスチャージ}
    help:
      - title: "「あり」が合うお店"
        text: |-
          セット料金とは別に、席料などを取るお店です。
          例)セット8000円+ハウスチャージ1000円

