    type: note
    onsite_note: キャスト本人が端末で入力し、身分証を提示する
    source: {sample: roster, question: 個人情報（本名・生年月日・電話・住所・給与振込口座・緊急連絡先・身分証明書の提出状況）は、すべて任意項目です。オーナー・店長だけが見られる欄に、あとからメンバーごとに個別入力します。}

  - id: member_withholding
