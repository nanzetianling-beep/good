      例)ヘルプ/0円/0
      お店の指名区分を、1行に1つずつ書いてください。
    help:
      - title: "書き方"
        text: |-
          指名の種類と、その料金を書きます。

          本指名:お客様が指名して来店したとき
          場内指名:店内で気に入って指名したとき
          同伴:キャストと一緒に来店したとき

