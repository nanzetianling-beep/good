    help:
      - title: "「切り捨て」が合うお店"
        text: |-
          お客様に安い方でお会計するお店です。
          例)100円単位で、12,345円 → 12,300円
      - title: "「切り上げ」が合うお店"
        text: |-
          お店に高い方でお会計するお店です。
          例)100円単位で、12,345円 → 12,400円

          端数処理が「なし」の場合は、
          どちらを選んでも会計は変わりません。

