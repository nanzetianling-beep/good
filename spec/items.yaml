  - id: member_commute
    route: onsite
    chapter: 11
    label: 交通費(キャストごとの最寄り駅・送りエリア)
    type: note
    onsite_note: 店舗がPOSへ直接入力する
    source: {sample: roster, question: （キャストごとに）交通費}

  # ── 既存見本 ⑬ 給与運用設定 ─────────────────────────────

  - id: closing_day
    route: form
    section: S10
    label: 締め日
    type: dropdown
    options: [5日, 10日, 15日, 20日, 25日, 末日]
    source: {sample: payroll, question: 締め日 ／ 支払日}
    hint: |-
      給与を計算する期間の、最後の日です
    help:
      - title: "選び方"
        text: |-
          例)「末日」なら、1日〜月末の勤務を計算します。
          例)「15日」なら、前月16日〜15日の勤務です。

          月2回締めている場合は、訪問時に伺います。

  - id: pay_day
    route: form
    section: S10
    label: 支払日
    type: dropdown
    options: [5日, 10日, 15日, 20日, 25日, 末日]
    source: {sample: payroll, question: 締め日 ／ 支払日}
    hint: |-
      給与を支払う日です
    help:
      - title: "選び方"
        text: |-
          例)末日締め・翌月10日払い → 「10日」
          例)15日締め・当月25日払い → 「25日」

  - id: wage_rounding_unit
    route: form
    section: S10
    label: 時給の丸め(単位)
    type: dropdown
    options: [1分, 5分, 10分, 15分, 30分]
    source: {sample: payroll, question: 時給の丸め}
    hint: |-
      勤務時間を、何分単位で数えるかです
    help:
      - title: "選び方"
        text: |-
          1時間50分働いたときの例です(切り捨て)。

          1分 → 1時間50分
          15分 → 1時間45分
          30分 → 1時間30分

          1分単位なら、働いた時間のまま計算します。

  - id: wage_rounding_mode
    route: form
    section: S10
    label: 時給の丸め(方法)
    type: dropdown
    options: [切り捨て, 切り上げ]
    source: {sample: payroll, question: 時給の丸め}
    hint: |-
      端数の時間を、切り捨てるか切り上げるかです
    help:
      - title: "「切り捨て」が合うお店"
        text: |-
          端数の時間は、給与に入れないお店です。
          例)15分単位で1時間50分 → 1時間45分
      - title: "「切り上げ」が合うお店"
        text: |-
          端数の時間も、次の単位まで入れるお店です。
          例)15分単位で1時間50分 → 2時間

  - id: main_withholding_type
    route: form
    section: S10
    label: 主に使う源泉区分
    type: radio
    options: ["報酬源泉(10.21%)", "ホステス源泉(日額5,000円控除)", 給与源泉]
    hint: 率は初期値で設定します。キャストごとの区分は訪問時に入力します
    source: {sample: payroll, question: 源泉率}
    help:
      - title: "それぞれの意味"
        text: |-
          報酬源泉:支払額に10.21%をかけて差し引きます
          例)報酬10万円 → 10,210円を差し引く

          ホステス源泉:1日5,000円を引いてから、
          10.21%をかけて差し引きます
          例)報酬10万円・出勤10日 → 5,105円

          給与源泉:給与として、税額表で計算します

          わからない場合は、税理士さんに確認してください。

  - id: withholding_rates
    route: fixed
    label: 源泉率
    type: table
    columns: [区分, 率 / 控除額]
    default:
      - [報酬源泉, 10.21%]
      - [ホステス源泉, "10.21%(日額5,000円控除)"]
      - [給与源泉, 0%]
    source: {sample: payroll, question: 源泉率}

  - id: commute_min_hours
    route: form
    section: S10
    label: 交通費の対象になる最低勤務時間
    type: number
    unit: 時間
    validation: {kind: number, min: 0, max: 24, message: 0〜24の数字で入力してください}
    source: {sample: payroll, question: 交通費の対象条件}
    hint: |-
      交通費を出す、最低の勤務時間です
    help:
      - title: "入力のしかた"
        text: |-
          例)「3」なら、3時間以上働いた日だけ出ます。
          例)「4」なら、4時間以上働いた日だけ出ます。

          時間の条件がない場合は「0」です。

  - id: commute_full_day_hours
    route: form
    section: S10
    label: フル日とみなす勤務時間
    type: number
    unit: 時間
    validation: {kind: number, min: 0, max: 24, message: 0〜24の数字で入力してください}
    source: {sample: payroll, question: 交通費の対象条件}
    hint: |-
      何時間働いたら、1日フルの勤務とみなすかです
    help:
      - title: "入力のしかた"
        text: |-
          例)「5」なら、5時間以上をフル日と数えます。
          例)「6」なら、6時間以上をフル日と数えます。

          交通費や手当を、フル日の数で決めるときに
          使います。

  - id: welfare_amount
    route: form
    section: S10
    label: 福利厚生費
    type: number
    unit: 円
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    source: {sample: payroll, question: 福利厚生費}
    hint: |-
      給与から差し引く、福利厚生費の金額です
    help:
      - title: "入力のしかた"
        text: |-
          例)1日500円なら「500」
          例)毎月3,000円なら「3000」

          差し引いていないお店は「0」です。

  - id: welfare_unit
    route: form
    section: S10
    label: 福利厚生費の単位
    type: radio
    options: [期間ごと, 出勤日ごと]
    source: {sample: payroll, question: 福利厚生費}
    hint: |-
      福利厚生費を、どの単位で差し引くかです
    help:
      - title: "「期間ごと」が合うお店"
        text: |-
          給与の締めごとに、1回だけ差し引くお店です。
          例)毎月3,000円を1回差し引く
      - title: "「出勤日ごと」が合うお店"
        text: |-
          出勤した日の数だけ、差し引くお店です。
          例)1日500円・出勤10日なら、5,000円

  - id: late_deduction
    route: form
    section: S10
    label: 遅刻控除
    type: radio
    options: [使わない, 使う]
    source: {sample: payroll, question: 遅刻控除を使うか}
    hint: |-
      遅刻したとき、給与から差し引くかどうかです
    help:
      - title: "「使う」が合うお店"
        text: |-
          遅刻した分を、給与から差し引くお店です。
          例)1分50円で10分遅刻なら、500円を差し引く
      - title: "「使わない」が合うお店"
        text: |-
          遅刻しても、給与から差し引かないお店です。
          例)遅刻は注意だけで、金額は変えない

  - id: late_deduction_per_minute
    route: form
    section: S10
    label: 遅刻控除(1分あたり)
    type: number
    unit: 円
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    show_if: {item: late_deduction, equals: 使う}
    source: {sample: payroll, question: 遅刻控除の内容}
    hint: |-
      遅刻1分あたりに差し引く金額です
    help:
      - title: "入力のしかた"
        text: |-
          例)1分50円なら「50」
          → 10分遅刻で500円、30分遅刻で1,500円

  - id: late_penalty_points
    route: onsite
    chapter: 12
    label: 遅刻の減点(1分あたり・pt)
    type: note
    onsite_note: 3章のフォームでは聞かない。ポイント時給を使う店舗だけ、訪問時に設定する
    source: {sample: payroll, question: 遅刻控除の内容}

  - id: late_grace_minutes
    route: form
    section: S10
    label: 遅刻の猶予
    type: number
    unit: 分
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    show_if: {item: late_deduction, equals: 使う}
    source: {sample: payroll, question: 遅刻の猶予・上限}
    hint: |-
      この分数までの遅刻は、差し引かない猶予です
    help:
      - title: "入力のしかた"
        text: |-
          例)「5」なら、5分までの遅刻は差し引きません。
          例)「0」なら、1分の遅刻から差し引きます。

  - id: late_daily_cap
    route: form
    section: S10
    label: 遅刻控除の1日の上限
    type: number
    unit: 円
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    show_if: {item: late_deduction, equals: 使う}
    source: {sample: payroll, question: 遅刻の猶予・上限}
    hint: |-
      1日に差し引く金額の上限です。
      上限がない場合は「0」を入力してください
    help:
      - title: "入力のしかた"
        text: |-
          例)「3000」なら、何分遅れても1日3,000円まで
          例)「0」なら、上限なし(遅れた分だけ差し引く)

  - id: daily_advance_cap
    route: form
    section: S10
    label: 日払いの上限
    type: number
    unit: 円
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    source: {sample: payroll, question: 日払いの上限}
    hint: |-
      1日に日払いできる金額の上限です。
      上限がない場合は「0」を入力してください
    help:
      - title: "入力のしかた"
        text: |-
          日払い:その日の給与の一部を、当日に渡すことです。

          例)「10000」なら、1日10,000円まで
          例)「0」なら、上限なし

  - id: pay_ratio_alert
    route: form
    section: S10
    label: 給率の警告しきい値
    type: number
    unit: "%"
    hint: 担当売上に対するバック率がこれを超えたら、画面でお知らせします
    validation: {kind: number, min: 0, max: 100, message: 0〜100の数字で入力してください}
    source: {sample: payroll, question: 給率の警告しきい値}
    help:
      - title: "入力のしかた"
        text: |-
          給率:担当売上に対する、バックの割合です。

          例)「50」なら、売上10万円に対して
          バックが5万円を超えたときにお知らせします。

          お知らせが不要なら「0」を入力してください。

  - id: send_areas_use
    route: form
    section: S10
    label: 送り代
    type: radio
    options: [なし, あり]
    hint: キャストの送りに、エリアごとの送り代を決めている場合は「あり」です
    source: {doc: 2026-09-25 記入テンプレートからアンケートへ移動}
    help:
      - title: "「あり」が合うお店"
        text: |-
          キャストの送りで、エリアごとに
          送り代を決めているお店です。
          例)新宿区は500円、杉並区は1,000円
      - title: "「なし」が合うお店"
        text: |-
          送り代を取っていないお店です。
          例)送りがない、または送りは無料

  - id: send_areas
    route: form
    section: S10
    label: 送りエリアごとの送り代
    type: table
    columns: [エリア名, 送り代(円)]
    cells: [text, int]
    examples:
      - [みなとみらい, 1500]
      - [関内, 1000]
    show_if: {item: send_areas_use, equals: あり}
    source: {sample: payroll, question: 送りエリア別の金額}
    hint: |-
      エリアごとの送り代を、1行に1つ書いてください
    help:
      - title: "書き方"
        text: |-
          送り代は、キャストの給与から差し引く金額です。

          例)新宿区/500
          例)杉並区/1000
          例)埼玉方面/2000

  - id: busy_hours_use
    route: form
    section: S10
    label: 時給を上げる時間帯
    type: radio
    options: [なし, あり]
    hint: 忙しい時間帯だけ、時給を上げている場合は「あり」です
    source: {doc: 2026-09-25 記入テンプレートからアンケートへ移動}
    help:
      - title: "「あり」が合うお店"
        text: |-
          忙しい時間帯だけ、時給を上げているお店です。
          例)22時〜24時は、時給を1.2倍にする
      - title: "「なし」が合うお店"
        text: |-
          時間帯で、時給を変えないお店です。
          例)何時に働いても、時給は同じ

  - id: busy_hours
    route: form
    section: S10
    label: 時給を上げる時間帯と、上げ方
    type: table
    columns: [開始, 終了, 倍率または加算額]
    cells: [time, time, text]
    examples:
      - ["22:00", "24:00", 1.2倍]
    hint: 例:22時〜24時は時給を1.2倍、または+300円
    show_if: {item: busy_hours_use, equals: あり}
    source: {sample: payroll, question: 繁忙時間帯の時給（期間限定）}
    help:
      - title: "書き方"
        text: |-
          開始と終了の時刻を選び、上げ方を書きます。

          例)22:00/24:00/1.2倍
          例)0:00/2:00/+300円
