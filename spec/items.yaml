      - title: "「使う」が合うお店"
        text: |-
          バックの端数を、きりのいい金額にするお店です。
          例)100円単位なら、バック1,234円 → 1,200円
      - title: "「使わない」が合うお店"
        text: |-
          計算した金額を、1円単位でそのまま払うお店です。
          例)バック1,234円は、そのまま1,234円

  - id: back_rounding_unit
    route: form
    section: S4
    label: バック端数の丸め単位
    type: radio
    options: [10円, 100円, 記入]
    other: {type: number, unit: 円, min: 1, max: 10000}
    show_if: {item: back_rounding, equals: 使う}
    source: {sample: nomination, question: バック端数の丸め単位}
    hint: |-
      バックの端数を、何円単位でそろえるかです
    help:
      - title: "選び方"
        text: |-
          例)10円単位なら、1,234円 → 1,230円
          例)100円単位なら、1,234円 → 1,200円

          一覧にない単位(50円など)は「記入」を選び、
          横の欄に数字を入力します。

  - id: back_rules
    route: onsite
    chapter: 5
    label: バックルール(10パターン)・ボトル折半
    type: table
    columns: [ルール名, 対象の指名区分, 決め方, 金額 / 率]
    onsite_note: 10パターンから店舗のルールを選び、その場で設定する
    source: {sample: nomination, question: バックルール}

  - id: back_rule_examples
    route: onsite
    chapter: 5
    label: 指名バックの決め方(記入例)
    type: table
    columns: [ルール名, 対象の指名区分, 決め方, 金額 / 率]
    onsite_note: バックルール設定時の例として使う
    source: {sample: nomination, question: （記入例）指名バックの決め方}

  # ── 既存見本 ④ 税・インボイス ─────────────────────────────

  - id: invoice_registered
    route: form
    section: S5
    label: インボイス登録
    type: radio
    options: [登録している, 登録していない]
    source: {sample: tax, question: 適格請求書 登録番号}
    hint: |-
      インボイス(適格請求書)の登録をしているかどうかです
    help:
      - title: "「登録している」が合うお店"
        text: |-
          「T」から始まる13桁の番号を持っているお店です。
          例)T1234567890123

          次の質問で番号を入力します。
      - title: "「登録していない」が合うお店"
        text: |-
          登録番号を持っていないお店です。

          わからない場合は、顧問の税理士さんや
          会計担当の方に確認してください。

  - id: invoice_number
    route: form
    section: S5
    label: インボイス登録番号
    type: short
    placeholder: 例:T1234567890123
    validation: {kind: regex, pattern: '^T\d{13}$', message: 「T」から始まる14文字で入力してください(例:T1234567890123)}
    show_if: {item: invoice_registered, equals: 登録している}
    source: {sample: tax, question: 適格請求書 登録番号}
    hint: |-
      「T」と13桁の数字を入力してください
    help:
      - title: "確認のしかた"
        text: |-
          税務署から届いた登録通知書に書いてあります。
          例)T1234567890123

          国税庁のインボイス公表サイトで、
          店名や会社名からも調べられます。

  - id: tax_rate_notice
    route: form
    section: S5
    label: 税率
    type: note
    body: 税率は10%(軽減8%)で設定します
    source: {sample: tax, question: 税率}

  - id: tax_rate_standard
    route: fixed
    label: 標準税率
    type: number
    unit: "%"
    default: 10
    source: {sample: tax, question: 税率}

  - id: tax_rate_reduced
    route: fixed
    label: 軽減税率
    type: number
    unit: "%"
    default: 8
    source: {sample: tax, question: 税率}

  - id: price_display
    route: form
    section: S5
    label: 価格の表示方法
    type: radio
    options: [内税(税込表示), 外税(税抜表示)]
    source: {sample: tax, question: 表示価格}

  # ── 既存見本 ⑤ 決済方法 ─────────────────────────────────
    hint: |-
      メニューの金額が、税込みか税抜きかです
    help:
      - title: "「内税(税込表示)」が合うお店"
        text: |-
          メニューの金額に、税が入っているお店です。
          例)メニュー8,000円 → 会計も8,000円
      - title: "「外税(税抜表示)」が合うお店"
        text: |-
          メニューの金額に、税を足して会計するお店です。
          例)メニュー8,000円 → 会計は8,800円

  - id: cash_surcharge
    route: fixed
    label: 現金の上乗せ手数料
    type: number
    unit: "%"
    default: 0
    source: {sample: payments, question: 決済方法ごとの上乗せ手数料}

  - id: card_surcharge
    route: form
    section: S6
    label: カード払いの上乗せ手数料
    type: radio
    options: [なし, あり]
    other: {type: number, unit: "%", min: 0, max: 100}
    hint: カード会社の規約で、手数料の上乗せが禁止されている場合があります
    source: {sample: payments, question: 決済方法ごとの上乗せ手数料}
    help:
      - title: "「あり」が合うお店"
        text: |-
          カード払いのとき、会計に手数料を足すお店です。
          例)会計10,000円・上乗せ10%なら、11,000円

          「あり」の横の欄に、率を入力します。
      - title: "「なし」が合うお店"
        text: |-
          カード払いでも、現金と同じ金額のお店です。
          例)会計10,000円は、カードでも10,000円

  - id: credit_surcharge
    route: form
    section: S6
    label: 売掛の上乗せ手数料
    type: radio
    options: [なし, あり]
    other: {type: number, unit: "%", min: 0, max: 100}
    source: {sample: payments, question: 決済方法ごとの上乗せ手数料}
    hint: |-
      売掛(ツケ)で会計するとき、手数料を足すかどうかです
    help:
      - title: "「あり」が合うお店"
        text: |-
          売掛のとき、会計に手数料を足すお店です。
          例)会計50,000円・上乗せ10%なら、55,000円

          「あり」の横の欄に、率を入力します。
      - title: "「なし」が合うお店"
        text: |-
          売掛でも、現金と同じ金額のお店です。
          例)売掛をしていないお店も「なし」です

  - id: card_fee
    route: form
    section: S6
    label: カード決済手数料(店舗負担)
    type: number
    unit: "%"
    hint: 内税(税込表示)のときだけ、自動で適用されます
    validation: {kind: number, min: 0, max: 100, message: 0〜100の数字で入力してください}
    source: {sample: payments, question: カード決済手数料（店舗共通）}

  # ── 既存見本 ⑥ 商品メニュー ─────────────────────────────
    help:
      - title: "入力のしかた"
        text: |-
          カード会社に払う、決済手数料の率です。
          カード会社の契約書や、明細で確認できます。

          例)3.24%なら「3.24」
          例)3.6%なら「3.6」

          カード払いを使わないお店は「0」です。

  - id: product_categories
    route: template
    theme: 3
    label: カテゴリー
    type: table
    merged_into: products   # 商品の表の「カテゴリー」「種別」の列で兼ねる
    columns: [カテゴリー, 種別]
    examples:
      - [シャンパン, ボトル]
      - [ソフトドリンク, ドリンク]
    source: {sample: products, question: カテゴリー}

  - id: products
    route: template
    theme: 3
    label: 商品
    type: table
    columns: [カテゴリー, 種別, 商品名, 価格(円), キャストドリンク, ボトルキープ]
    cells: [text, [ドリンク, ボトル, フード, その他], text, int, [○], [○]]
    examples:
      - [シャンパン, ボトル, ヴーヴクリコ, 28000, "", ○]
      - [ソフトドリンク, ドリンク, ウーロン茶, 800, ○, ""]
    line: {format: [カテゴリー, 商品名, 金額], examples: [[シャンパン, ヴーヴクリコ, 28000], [ソフトドリンク, ウーロン茶, 800]]}
    source: {sample: products, question: 商品}

  - id: product_variants
    route: onsite
    label: 商品ごとの種類・時価
    type: note
    onsite_note: 商品をPOSへ転記したあと、訪問時に確認する
    source: {sample: products, question: 商品ごとの「種類」（例：ヴーヴクリコ→イエロー/ホワイト）や「時価」設定は、商品を登録したあと個別に伺います。}

  # ── 既存見本 ⑦ 卓とフロアマップ ───────────────────────────

  - id: tables
    route: form
    section: S11
    label: 卓の一覧
    type: table
    columns: [卓名, 席数]
    cells: [text, int]
    examples:
      - [VIP1, 6]
      - [カウンター, 8]
    hint: |-
      お店にある卓を、1行に1つ書いてください。
      配置は、訪問時にPOSの画面で一緒に決めます。
    source: {sample: tables, question: 卓の一覧}
    help:
      - title: "書き方"
        text: |-
          卓名は、お店で呼んでいる名前で大丈夫です。
          席数は、座れるお客様の人数の目安です。

          例)A卓/4
          例)VIP1/6
          例)カウンター1/1

          卓の数だけ、「行を追加」で行を増やします。

  - id: floor_map
    route: onsite
    chapter: 2
    label: フロアマップの配置
    type: note
    onsite_note: フロアマップ上で卓をドラッグして配置する
    source: {sample: tables, question: フロアマップ上の配置（どの位置に置くか）は、導入日にPOS画面上でドラッグして決めます。ここでは卓の名前と数だけ伺います。}

  # ── 既存見本 ⑧ 流入経路 ─────────────────────────────────

  - id: referral_tags
    route: form
    section: S9
    label: 来店きっかけの集計タグ
    type: checkbox
    options: [新規, リピーター, 紹介, SNS, ビラ, 看板]
    other: {type: short}
    hint: 金額の計算には影響しません。あとから追加できます
    source: {sample: referral, question: 集計タグ}

  # ── 既存見本 ⑩ レジ・日報 ───────────────────────────────
    help:
      - title: "使い方"
        text: |-
          お客様が来たきっかけを、
          会計のときに選んで記録するためのタグです。

          例)SNSを見て来た → 「SNS」
          例)常連さんの紹介 → 「紹介」
          例)お店の前を通って → 「看板」

          集計に使いたいものに、すべてチェックします。

  - id: register_float
    route: form
    section: S7
    label: いつものレジ金(釣銭準備額)
    type: number
    unit: 円
    placeholder: 例:50000
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    source: {sample: register, question: いつものレジ金（釣銭準備額）}
    hint: |-
      営業を始める前に、レジに入れておく現金です
    help:
      - title: "入力のしかた"
        text: |-
          毎日、同じ金額をレジに入れて始める場合の
          その金額です。

          例)毎日5万円で始めるなら「50000」
          例)毎日3万円で始めるなら「30000」

  - id: cash_diff_lower
    route: form
    section: S7
    label: 現金過不足の許容範囲(下限・マイナス)
    type: number
    unit: 円
    placeholder: 例:1000
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    source: {sample: register, question: 現金過不足の許す範囲}
    hint: |-
      レジの現金が足りないとき、何円まで許すかです
    help:
      - title: "入力のしかた"
        text: |-
          閉店時にレジを数えて、
          本来より少なかったときの目安です。

          例)「1000」なら、1,000円までの不足はOK
          これを超えると、確認が必要と表示されます。

          1円でも合わなければ確認する場合は「0」です。

  - id: cash_diff_upper
    route: form
    section: S7
    label: 現金過不足の許容範囲(上限・プラス)
    type: number
    unit: 円
    placeholder: 例:1000
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    source: {sample: register, question: 現金過不足の許す範囲}

  # ── 既存見本 ⑪ プリンター・領収書 ─────────────────────────
    hint: |-
      レジの現金が多いとき、何円まで許すかです
    help:
      - title: "入力のしかた"
        text: |-
          閉店時にレジを数えて、
          本来より多かったときの目安です。

          例)「1000」なら、1,000円までの過剰はOK
          これを超えると、確認が必要と表示されます。

          1円でも合わなければ確認する場合は「0」です。

  - id: receipt_printer
    route: form
    section: S8
    label: |-
      レシートプリンター
      (EPSON/TM-m30Ⅲ-H・Star/MCP31LB)
    type: radio
    options: [ある, これから用意, 使わない]
    skip_to_on: {使わない: S9}
    source: {doc: 3章 S8}
    hint: |-
      POSにつなぐ、レシートプリンターがあるかどうかです
    help:
      - title: "「ある」が合うお店"
        text: |-
          タイトルの機種の、どちらかを持っているお店です。
      - title: "「これから用意」が合うお店"
        text: |-
          これから購入するお店です。
          訪問日までに届いていれば、当日に設定できます。
      - title: "「使わない」が合うお店"
        text: |-
          レシートや領収書を、POSから印刷しないお店です。
          例)領収書は手書きで渡している

  - id: printer_device
    route: onsite
    chapter: 8
    label: プリンター名・機器名
    type: note
    onsite_note: 現物で確認する
    source: {sample: printer, question: プリンター本体}

  - id: paper_width
    route: form
    section: S8
    label: 用紙幅
    type: radio
    options: [58mm, 80mm]
    source: {sample: printer, question: 使用する用紙幅}
    hint: |-
      レシートプリンターで使う、用紙の幅です
    help:
      - title: "選び方"
        text: |-
          58mm:幅の細い用紙です
          例)タクシーや小さなお店のレシート

          80mm:幅の広い用紙です
          例)コンビニやスーパーのレシート

          用紙の箱や、ロールの芯に書いてあります。
          これから用意する場合は、80mmがおすすめです。

  - id: receipt_design
    route: form
    section: S8
    label: 領収書のデザイン
    type: radio
    options: ["1", "2", "3"]
    hint: 下の見本から、刷りたいデザインの番号を選んでください
    # 各選択肢の見本画像。ポッキリ.Night の領収書プレビュー(nightwork-pos.vercel.app/api/receipt/preview)の
    # classic-frame・seigaiha-frame・kikka-frame をそのまま保存したもの。ファイルが無い番号は「見本画像を準備中」
    option_images: [form/images/receipt-1.svg, form/images/receipt-2.svg, form/images/receipt-3.svg]
    source: {sample: printer, question: 領収書のデザイン}
    help:
      - title: "選び方"
        text: |-
          下の見本を見比べて、お店に合う番号を選びます。
          例)シンプルな形がよい、店名を大きくしたい

          あとから変えたい場合は、訪問時に相談できます。

  - id: receipt_fields
    route: form
    section: S8
    label: 領収書に刷る内容
    type: checkbox
    options: [事業者名, インボイス登録番号]
    hint: 店舗名・電話番号・住所は必ず印字します
    source: {sample: printer, question: 領収書に刷る内容}
    help:
      - title: "それぞれの意味"
        text: |-
          事業者名:会社名や、個人事業の屋号です。
          例)株式会社ポッキリ

          インボイス登録番号:「T」から始まる番号です。
          例)T1234567890123

          インボイス対応の領収書にするなら、
          両方にチェックしてください。

  - id: slip_numbering
    route: form
    section: S8
    label: 伝票番号の採番
    type: radio
    options: [使わない, 使う]
    hint: |-
      伝票に通し番号を付けるかどうかです。
      例:接頭辞「A」・開始番号「1」なら、
      A1、A2、A3…と順に番号が付きます。
    source: {sample: printer, question: 伝票番号の採番}
    help:
      - title: "「使う」が合うお店"
        text: |-
          伝票ごとに番号を付けて、管理したいお店です。
          例)A1、A2、A3…と順に番号が付く
      - title: "「使わない」が合うお店"
        text: |-
          伝票に、番号を付けないお店です。
          例)伝票は卓名と時刻だけで管理している

  - id: slip_prefix
    route: form
    section: S8
    label: 伝票番号の接頭辞
    type: short
    placeholder: 例:A
    show_if: {item: slip_numbering, equals: 使う}
    source: {sample: printer, question: 伝票番号の採番}
    hint: |-
      伝票番号の前に付ける文字です
    help:
      - title: "入力のしかた"
        text: |-
          例)「A」なら、A1、A2、A3…
          例)「S」なら、S1、S2、S3…

          系列店がある場合は、店ごとに文字を変えると
          区別しやすくなります。
          特にこだわりがなければ「A」で大丈夫です。

  - id: slip_start
    route: form
    section: S8
    label: 伝票番号の開始番号
    type: number
    placeholder: 例:1
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    show_if: {item: slip_numbering, equals: 使う}
    source: {sample: printer, question: 伝票番号の採番}
    hint: |-
      最初の伝票番号です
    help:
      - title: "入力のしかた"
        text: |-
          例)「1」なら、A1から始まります。
          例)今の伝票が501番まで来ているなら「502」

          新しく始める場合は「1」で大丈夫です。

  - id: slip_reset
    route: form
    section: S8
    label: 採番のリセット単位
    type: dropdown
    options: [リセットしない, 営業日ごと, 月初にリセット]
    hint: 例:「営業日ごと」なら、毎日A1から数え直します
    show_if: {item: slip_numbering, equals: 使う}
    source: {sample: printer, question: 採番のリセット単位}
    help:
      - title: "選び方"
        text: |-
          リセットしない:番号がずっと増え続けます
          例)A1、A2…A999、A1000…

          営業日ごと:毎日1から数え直します
          例)今日のA1、明日もA1から

          月初にリセット:毎月1日に1から数え直します

  - id: kitchen_slip
    route: form
    section: S8
    label: キッチン伝票
    type: radio
    options: [使わない, 使う]
    source: {sample: printer, question: キッチン伝票に印刷するカテゴリ}
    hint: |-
      注文が入ったとき、キッチン用の伝票を印刷するかどうかです
    help:
      - title: "「使う」が合うお店"
        text: |-
          キッチンやバーで、注文を紙で確認するお店です。
          例)フードの注文が入ると、厨房で伝票が出る
      - title: "「使わない」が合うお店"
        text: |-
          注文を、口頭や画面で確認するお店です。
          例)ボーイがドリンクを作って運んでいる

  - id: kitchen_categories
    route: form
    section: S8
    label: キッチン伝票に印刷するカテゴリ
    type: checkbox
    options: [ドリンク, ボトル, フード, その他]
    show_if: {item: kitchen_slip, equals: 使う}
    source: {sample: printer, question: キッチン伝票に印刷するカテゴリ}

  # ── 既存見本 ⑫ メンバー台帳 ─────────────────────────────
    hint: |-
      キッチン伝票を印刷する、商品の種類です
    help:
      - title: "選び方"
        text: |-
          例)フードだけ厨房で作る → 「フード」だけ
          例)ドリンクもバーで作る → 「ドリンク」も

          印刷したい種類に、すべてチェックします。

  - id: cast_roster
